		<h1>PianoMan: piano virtual</h1>
		<p>Toca las teclas con el ratón, la pantalla táctil o las letras indicadas en el piano. Puedes cargar un archivo de texto para consultar tus notas.</p>
		<p>Proyecto de Eric Mejias Gamonal (Eriquito00) y David Catalan. <a href="https://ericmejias.es/">Portfolio de Eric Mejias Gamonal</a> · <a href="https://github.com/Eriquito00/PianoMan">Código de PianoMan en GitHub</a></p>
	</header>
